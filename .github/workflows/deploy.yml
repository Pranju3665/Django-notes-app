name: django-notes-app

on:
 push:
  branches:
     - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: setting up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installed dependencies
        run: | 
              python -m pip install --upgrade pip
              pip install mysqlclient
              pip install -r requirements.txt

      - name: Create Docker Network
        run: docker network create notes-app || true

      - name: Deploy application
        run: docker compose up -d

      - name: build iamge 
        run: docker build -t pranjal3665/django-notes-app:latest .

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
         username: ${{ secrets.DOCKER_USERNAME}}
         password: ${{ secrets.DOCKER_PASS}}

      - name: push images
        run: docker push pranjal3665/django-notes-app:latest

      - name: connect to Ec2
        uses: appleboy/ssh-action@v1.2.0
        with:
           host: ${{ secrets.EC2_hOST }}
           username: ${{ secrets.EC2_USERNAME}}
           key: ${{ secrets.EC2_SSH_KEY}}

           script: |
              set -e
              PROJECT_DIR="/home/ubuntu/projects/django-notes-app" 
              sudo -n systemctl enable --now docker 
              cd "$PROJECT_DIR"
              test -f docker-compose.yml 
              test -f .env
              git pull --ff-only origin main
              sudo docker network inspect notes-app >/dev/null 2>&1 || sudo docker network create notes-app
              sudo docker compose -f "$PROJECT_DIR/docker-compose.yml" pull django db
              sudo docker compose -f "$PROJECT_DIR/docker-compose.yml" up -d --build 
              sudo docker compose -f "$PROJECT_DIR/docker-compose.yml" ps




      

