name: django-notes-app

on:
  push:
    brances:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: setting up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installed dependencies
       run:
         pip install mysqlclient
         pip install -r requirements.txt

      - name: Deploy application
        run: docker compose up -d

      - name: build iamge 
        run: docker build -t pranjal3665/django-notes-app:latest .

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
        username: ${{ secrets.DOCKER_USERNAME}}
        password: ${{ secrets.DOCKER_PASS}}

      - name: push images
        run: docker push pranjal3665/django-notes-app:latest

      - name: connect to Ec2
        uses: application/ssh-action@v1.2.0
        with:
        host: ${{ secrets.EC2_hOST }}
        username: ${{ secrets.EC2_USERNAME}}
        key: ${{ secrets.EC2_SSH_KEY}}

        script:
               docker pull pranjal3665/django-notes-app:latest
               docker stop django-notes-app:latest || true
               docker rm django-notes-app:latest

               docker compose up -d 
               docker run -d --name django-notes-app --restart unless-stopped -p 80:80 pranjal3665/django-notes-app:latest





      

